<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="InkBridge 서재">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a63d6">
<link rel="manifest" href="/__pr/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/__pr/icon-180.png">
<title>InkBridge 서재</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --fg: #1c1c1e; --muted: #6e6e73; --line: #e5e5ea; --accent: #0a63d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --fg: #f2f2f7; --muted: #98989d; --line: #38383a; --accent: #4c9bff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; word-break: keep-all; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 28px 16px 8px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 12px; overflow: hidden; }
  li + li { border-top: 1px solid var(--line); }
  a.row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 12px 16px; color: inherit; text-decoration: none; }
  a.row:active { background: var(--line); }
  .text { flex: 1; min-width: 0; }
  .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .ink { color: var(--accent); font-size: 14px; white-space: nowrap; }
  .chev { color: var(--muted); font-size: 20px; }
  .empty { padding: 16px; color: var(--muted); }
  .tip { color: var(--muted); font-size: 14px; margin: 12px 16px 0; overflow-wrap: anywhere; }
  #converting { margin-bottom: 8px; }
  #converting li { padding: 12px 16px; font-size: 15px; }
  #converting .failed { color: #d1242f; }
</style>
</head>
<body>
<main>
  <h1>서재</h1>
  <p class="lead">문서를 열고 Apple Pencil로 쓰면 맥에 저장됩니다.</p>

  <h2>문서</h2>
  <ul id="converting" hidden></ul>
  <ul id="pages"><li class="empty">불러오는 중…</li></ul>
  <p class="tip" id="folder"></p>
  <p class="tip" id="install-tip">Safari 공유 메뉴에서 ‘홈 화면에 추가’를 누르면 Safari 창 없이 앱처럼 열립니다.</p>

  <h2>도구</h2>
  <ul>
    <li><a class="row" href="/__pr/view?follow=1"><span class="text"><span class="title">필기 보기</span><br><span class="meta">맥에서 열면 iPad가 지금 쓰는 문서·화면 방향·단계를 자동으로 따라갑니다</span></span><span class="chev">›</span></a></li>
    <li><a class="row" href="/__pen-test"><span class="text"><span class="title">입력 실험</span><br><span class="meta">Pencil·손가락·손바닥 입력 확인</span></span><span class="chev">›</span></a></li>
  </ul>
</main>
<script>
(() => {
  const list = document.getElementById('pages');
  if (navigator.standalone || matchMedia('(display-mode: standalone)').matches || /PencilReviewApp\//.test(navigator.userAgent)) document.getElementById('install-tip').hidden = true;
  const when = (iso) => {
    const d = new Date(iso);
    const today = new Date().toDateString() === d.toDateString();
    return today ? `오늘 ${d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}` : d.toLocaleDateString('ko-KR');
  };

  function row(p) {
    const a = document.createElement('a');
    a.className = 'row';
    a.href = '/' + p.path.split('/').map(encodeURIComponent).join('/');
    const text = document.createElement('span');
    text.className = 'text';
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = p.title || p.path;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = `${p.path} · 수정 ${when(p.modifiedAt)}`;
    text.append(title, document.createElement('br'), meta);
    const ink = document.createElement('span');
    ink.className = 'ink';
    ink.textContent = p.strokes ? `필기 ${p.strokes}획` : '';
    const chev = document.createElement('span');
    chev.className = 'chev';
    chev.textContent = '›';
    a.append(text, ink, chev);
    const li = document.createElement('li');
    li.append(a);
    return li;
  }

  async function renderConversions() {
    const box = document.getElementById('converting');
    const items = await (await fetch('/__pr/api/conversions')).json();
    box.hidden = !items.length;
    box.replaceChildren(...items.map((c) => {
      const li = document.createElement('li');
      const name = c.source.split('/').pop();
      if (c.status === 'failed') {
        li.className = 'failed';
        li.textContent = `변환 실패 · ${name} — ${c.error}`;
      } else li.textContent = `${c.status === 'converting' ? '변환 중' : '변환 대기'} · ${name}`;
      return li;
    }));
  }

  async function render() {
    try {
      const pages = await (await fetch('/__pr/api/pages')).json();
      if (!pages.length) {
        list.innerHTML = '<li class="empty">이 폴더에 HTML 파일이 없습니다.</li>';
        return;
      }
      list.replaceChildren(...pages.map(row));
    } catch {
      list.innerHTML = '<li class="empty">맥 서버에 연결할 수 없습니다.</li>';
    }
  }

  // New or edited files and new ink show up without reloading.
  let timer = 0;
  const later = () => {
    clearTimeout(timer);
    timer = setTimeout(render, 300);
  };
  const events = new EventSource('/__pr/events');
  events.addEventListener('reload', later);
  events.addEventListener('review', later);
  events.addEventListener('convert', () => {
    renderConversions().catch(() => {});
    later();
  });
  fetch('/__pr/api/info').then((r) => r.json()).then(({ root }) => {
    document.getElementById('folder').textContent = `HTML, PDF, PowerPoint·Keynote, Word·Pages 파일을 맥의 이 폴더에 넣으면 목록에 나옵니다: ${root}`;
  }).catch(() => {});
  renderConversions().catch(() => {});
  render();
})();
</script>
<!-- build b7d3f97044a5 -->
</body>
</html>
